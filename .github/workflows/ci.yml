name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Тесты
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: finderbot:ci
